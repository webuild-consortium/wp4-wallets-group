name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      # The published site is built entirely from wallet-capabilities/.
      # Changes elsewhere in the repo (root README, guidance/, feedback/)
      # cannot affect the build, so they must not trigger a republish.
      - 'wallet-capabilities/**'
      - '.github/workflows/deploy.yml'
  # Manual redeploy, e.g. to republish after a change this filter skips.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: wallet-capabilities/package-lock.json

      - name: Install dependencies
        working-directory: ./wallet-capabilities
        run: npm ci

      - name: Deploy to gh-pages
        working-directory: ./wallet-capabilities
        run: |
          git remote set-url origin https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          npm run deploy
        env:
          CACHE_DIR: ${{ runner.temp }}/.gh-pages-cache
